[package]
name = "oxblend"
version = "1.4.1"
edition = "2024"
rust-version = "1.94"
publish = true
license = "MIT"
description = "Read, trace and safely edit serialized Blender files without starting Blender"
readme = "README.md"
authors = ["kyraneth"]
repository = "https://github.com/kyraneth/oxblend"
homepage = "https://github.com/kyraneth/oxblend"
# Publish only the standalone public source, never local evidence or development state.
include = [
    "/Cargo.toml", "/Cargo.lock", "/build.rs", "/CHANGELOG.md", "/README.md", "/AGENTS.md", "/LICENSE", "/NOTICE",
    "/THIRD-PARTY-NOTICES", "/CONTRIBUTING.md", "/deny.toml",
    "/src/**", "/newtests/**", "/tests/*.rs", "/tests/fixtures/**",
    "/tests/support/**", "/tests/query-native-differences.json", "/examples/*.rs", "/docs/ARCHITECTURE.md",
    "/docs/FILE-FORMAT.md", "/docs/LICENSE.md", "/docs/MAINTAINING.md",
    "/docs/RELEASE-NOTES.md", "/docs/STABILITY.md", "/docs/USAGE.md", "/docs/QUERY.md",
    "/docs/FLATTRACE-MANIFEST.md", "/docs/flattrace-manifest.json",
    "/docs/NODE-TREE-EDIT.md", "/assets/template-5.2.1.blend", "/assets/logo/**",
    "/docs/error-catalog.json", "/docs/guidance.json", "/docs/KNOWN-ISSUES.md", "/docs/WASM-READ-ONLY.md", "/docs/REPORTING.md",
    "/scripts/**", "/skills/oxblend/**", "/integration/file_ops_kit.py", "/flattrace-events.json",
]

[features]
default = ["native"]
native = ["dep:libc", "dep:flate2", "dep:zstd", "dep:regex", "dep:serde_json", "dep:exr"]
wasm-read-only = []

[[bin]]
name = "oxblend"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
# Pixel codec only; header inventory remains our reader. Native-only.
exr = { version = "=1.74.2", default-features = false, optional = true }
# Native filesystem, compressed containers and local tracing stay out of wasm.
libc = { version = "=0.2.190", optional = true }
flate2 = { version = "=1.1.10", optional = true }
zstd = { version = "=0.14.0", optional = true }
serde_json = { version = "=1.0.150", optional = true }
regex = { version = "=1.12.4", optional = true }
