[package]
name = "oxblend-python"
# Proposed independent version: this is the sole binding version owner.
version = "1.4.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Typed in-process Blender file inspection, dependency tracing and safe editing for Python"

[workspace]
resolver = "3"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
oxblend = { path = "../..", version = "=1.4.1" }
# Reviewed against crates.io release metadata on 2026-10-22.
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
# Engine's already-locked structured report values; no JSON encode/decode.
serde_json = "=1.0.150"
